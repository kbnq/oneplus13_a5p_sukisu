name: OnePlus 13T CustomROM

on:
  workflow_dispatch:
    inputs:
      enable_feature_x:
        description: 是否启用KPM
        required: false
        default: false
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_HARDLINK: "true"
      CCACHE_DIR: /home/runner/.ccache
      CCACHE_MAXSIZE: 8G
    steps:
      - name: Checkout build repository
        uses: actions/checkout@v4

      - name: Maximize build space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 8192
          temp-reserve-mb: 2048
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'

      - name: Configure Git
        run: |
          git config --global user.name "44C38B8"
          git config --global user.email "b2762537725@163.com"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 git curl ccache zip libelf-dev

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: /home/runner/.ccache
          key: ccache-oneplus13t-customrom-${{ runner.os }}-${{ github.ref }}
          restore-keys: |
            ccache-oneplus13t-customrom-${{ runner.os }}-
            ccache-${{ runner.os }}-

      - name: Install repo tool
        run: |
          curl -L --fail --retry 3 https://storage.googleapis.com/git-repo-downloads/repo -o ~/repo
          chmod a+x ~/repo
          sudo mv ~/repo /usr/local/bin/repo

      - name: Initialize latest OnePlus 13T source
        run: |
          mkdir kernel_workspace
          cd kernel_workspace
          repo init -u https://github.com/OnePlusOSS/kernel_manifest.git \
            -b refs/heads/oneplus/sm8750 -m oneplus_13t_b.xml --depth=1
          repo --trace sync -c -j"$(nproc --all)" --no-tags
          rm -f kernel_platform/common/android/abi_gki_protected_exports_*
          rm -f kernel_platform/msm-kernel/android/abi_gki_protected_exports_*

      - name: Set up SukiSU Ultra
        run: |
          cd kernel_workspace/kernel_platform
          curl -LSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh" | bash -s builtin
          cd KernelSU
          KSU_VERSION=$(($(git rev-list --count HEAD) + 37185))
          echo "KSUVER=${KSU_VERSION}" >> "$GITHUB_ENV"

      - name: Fix SukiSU kernel umount compatibility
        working-directory: kernel_workspace/kernel_platform/common
        run: |
          UMOUNT=drivers/kernelsu/feature/kernel_umount.c
          if [ -f "$UMOUNT" ] && \
             grep -q 'kernel_umount_feature_set' "$UMOUNT" && \
             ! grep -q '^static int kernel_umount_feature_set' "$UMOUNT"; then
            perl -0pi -e 's/(static const struct ksu_feature_handler kernel_umount_handler)/static int kernel_umount_feature_set(u64 value)\n{\n    ksu_kernel_umount_enabled = value != 0;\n    pr_info("kernel_umount: set to %d\\n", ksu_kernel_umount_enabled);\n    return 0;\n}\n\n$1/' "$UMOUNT"
          fi
          grep -q '^static int kernel_umount_feature_set' "$UMOUNT"

      - name: Set up SUSFS and LZ4K
        run: |
          cd kernel_workspace
          git clone --depth=1 -b gki-android15-6.6 https://gitlab.com/simonpunk/susfs4ksu.git
          git clone --depth=1 https://github.com/SukiSU-Ultra/SukiSU_patch.git

          cd kernel_platform
          cp ../susfs4ksu/kernel_patches/50_add_susfs_in_gki-android15-6.6.patch common/
          cp ../susfs4ksu/kernel_patches/fs/* common/fs/
          cp ../susfs4ksu/kernel_patches/include/linux/* common/include/linux/
          cp -r ../SukiSU_patch/other/zram/lz4k/include/linux/* common/include/linux/
          cp -r ../SukiSU_patch/other/zram/lz4k/lib/* common/lib/
          cp -r ../SukiSU_patch/other/zram/lz4k/crypto/* common/crypto/
          cp -r ../SukiSU_patch/other/zram/lz4k_oplus common/lib/

          cd common
          grep -q '#include <linux/dma-buf.h>' fs/proc/base.c || \
            sed -i '/#include <linux\/cpufreq_times.h>/a #include <linux/dma-buf.h>' fs/proc/base.c
          patch -p1 --forward < 50_add_susfs_in_gki-android15-6.6.patch
          cp ../../SukiSU_patch/other/zram/zram_patch/6.6/lz4kd.patch ./
          patch -p1 -F 3 --forward < lz4kd.patch

      - name: Fix SUSFS SELinux linkage for custom ROM
        working-directory: kernel_workspace/kernel_platform/common
        run: |
          RULES=../KernelSU/kernel/selinux/rules.c
          if ! grep -q '^struct selinux_policy \*backup_sepolicy;' "$RULES"; then
            sed -i '/^#define ALL NULL/a\
          \
          #ifdef CONFIG_KSU_SUSFS\
          struct selinux_policy *backup_sepolicy;\
          #endif' "$RULES"
          fi
          if ! grep -q 'backup_sepolicy = pol;' "$RULES"; then
            sed -i '/rcu_assign_pointer(selinux_state.policy, pol);/a\
          #ifdef CONFIG_KSU_SUSFS\
              backup_sepolicy = pol;\
          #endif' "$RULES"
          fi

      - name: Apply original HMBIRD GKI bridge
        run: |
          HMBIRD_C=kernel_workspace/kernel_platform/common/drivers/hmbird_patch.c
          cat > "$HMBIRD_C" <<'EOF'
          #include <linux/init.h>
          #include <linux/module.h>
          #include <linux/of.h>
          #include <linux/slab.h>
          #include <linux/string.h>

          static int __init hmbird_patch_init(void)
          {
              struct device_node *ver_np;
              struct property *prop;
              struct property *new_prop;
              const char *type;
              int ret;

              ver_np = of_find_node_by_path("/soc/oplus,hmbird/version_type");
              if (!ver_np)
                  return 0;

              ret = of_property_read_string(ver_np, "type", &type);
              if (ret || strcmp(type, "HMBIRD_OGKI"))
                  goto out;

              prop = of_find_property(ver_np, "type", NULL);
              if (!prop)
                  goto out;

              new_prop = kmalloc(sizeof(*new_prop), GFP_KERNEL);
              if (!new_prop)
                  goto out;

              memcpy(new_prop, prop, sizeof(*new_prop));
              new_prop->value = kstrdup("HMBIRD_GKI", GFP_KERNEL);
              if (!new_prop->value) {
                  kfree(new_prop);
                  goto out;
              }
              new_prop->length = strlen("HMBIRD_GKI") + 1;

              if (of_remove_property(ver_np, prop) ||
                  of_add_property(ver_np, new_prop)) {
                  kfree(new_prop->value);
                  kfree(new_prop);
                  goto out;
              }

              pr_info("hmbird_patch: changed HMBIRD_OGKI to HMBIRD_GKI\n");
          out:
              of_node_put(ver_np);
              return 0;
          }
          early_initcall(hmbird_patch_init);

          MODULE_LICENSE("GPL");
          MODULE_DESCRIPTION("Convert the OnePlus HMBIRD device tree mode to GKI");
          EOF
          MAKEFILE=kernel_workspace/kernel_platform/common/drivers/Makefile
          grep -q 'hmbird_patch.o' "$MAKEFILE" || echo 'obj-y += hmbird_patch.o' >> "$MAKEFILE"

      - name: Configure kernel
        working-directory: kernel_workspace/kernel_platform/common
        run: |
          DEFCONFIG=arch/arm64/configs/gki_defconfig
          cat >> "$DEFCONFIG" <<'EOF'
          CONFIG_KSU=y
          CONFIG_KSU_SUSFS_SUS_SU=n
          CONFIG_KSU_SUSFS=y
          CONFIG_KSU_SUSFS_HAS_MAGIC_MOUNT=y
          CONFIG_KSU_SUSFS_SUS_PATH=y
          CONFIG_KSU_SUSFS_SUS_MOUNT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT=y
          CONFIG_KSU_SUSFS_SUS_KSTAT=y
          CONFIG_KSU_SUSFS_SUS_OVERLAYFS=n
          CONFIG_KSU_SUSFS_TRY_UMOUNT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_TRY_UMOUNT_FOR_BIND_MOUNT=y
          CONFIG_KSU_SUSFS_SPOOF_UNAME=y
          CONFIG_KSU_SUSFS_ENABLE_LOG=y
          CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y
          CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y
          CONFIG_KSU_SUSFS_OPEN_REDIRECT=y
          CONFIG_KSU_SUSFS_SUS_MAP=n
          CONFIG_CRYPTO_LZ4HC=y
          CONFIG_CRYPTO_LZ4K=y
          CONFIG_CRYPTO_LZ4KD=y
          CONFIG_CRYPTO_842=y
          CONFIG_LOCALVERSION_AUTO=n
          CONFIG_TCP_CONG_ADVANCED=y
          CONFIG_TCP_CONG_BBR=y
          CONFIG_NET_SCH_FQ=y
          CONFIG_TCP_CONG_BIC=n
          CONFIG_TCP_CONG_CUBIC=n
          CONFIG_TCP_CONG_WESTWOOD=n
          CONFIG_TCP_CONG_HTCP=n
          CONFIG_DEFAULT_TCP_CONG=bbr
          CONFIG_TMPFS_XATTR=y
          CONFIG_TMPFS_POSIX_ACL=y
          EOF

          if [ "${{ inputs.enable_feature_x }}" = "true" ]; then
            echo 'CONFIG_KPM=y' >> "$DEFCONFIG"
          fi

          sed -i 's/check_defconfig//' build.config.gki
          sed -i 's/${scm_version}//' scripts/setlocalversion
          sed -i 's/-4k/-android15-8-gd43086512890-abogki423825152-4k/g' "$DEFCONFIG"

      - name: Add sched_ext
        working-directory: kernel_workspace/kernel_platform
        run: |
          git clone --depth=1 https://github.com/HanKuCha/sched_ext.git
          cp -r sched_ext/* common/kernel/sched/

      - name: Build kernel
        run: |
          export KBUILD_BUILD_TIMESTAMP="Tue Jun 10 12:12:23 UTC 2025"
          export PATH="$GITHUB_WORKSPACE/kernel_workspace/kernel_platform/prebuilts/clang/host/linux-x86/clang-r510928/bin:/usr/lib/ccache:$PATH"
          cd kernel_workspace/kernel_platform/common
          make -j"$(nproc --all)" LLVM=1 ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- CC=clang \
            RUSTC=../../prebuilts/rust/linux-x86/1.73.0b/bin/rustc \
            PAHOLE=../../prebuilts/kernel-build-tools/linux-x86/bin/pahole \
            LD=ld.lld HOSTLD=ld.lld O=out KCFLAGS+=-O2 KCFLAGS_PERF+=-O3 \
            gki_defconfig all
          test -s out/arch/arm64/boot/Image

      - name: Apply KPM image patch
        if: inputs.enable_feature_x
        working-directory: kernel_workspace/kernel_platform/common/out/arch/arm64/boot
        run: |
          curl -L --fail --retry 3 \
            https://github.com/SukiSU-Ultra/SukiSU_KernelPatch_patch/releases/download/0.12.0/patch_linux \
            -o patch_linux
          chmod +x patch_linux
          ./patch_linux
          test -s oImage
          mv oImage Image

      - name: Package AnyKernel3
        id: package
        run: |
          git clone --depth=1 https://github.com/Kernel-SU/AnyKernel3.git
          rm -rf AnyKernel3/.git AnyKernel3/push.sh
          cp kernel_workspace/kernel_platform/common/out/arch/arm64/boot/Image AnyKernel3/
          test -s AnyKernel3/Image
          ZIP_NAME="OnePlus13T_CustomROM_SukiSU_${KSUVER}.zip"
          (cd AnyKernel3 && zip -r "../${ZIP_NAME}" .)
          echo "zip_name=${ZIP_NAME}" >> "$GITHUB_OUTPUT"

      - name: Upload AnyKernel3
        uses: actions/upload-artifact@v4
        with:
          name: SukiSU_${{ env.KSUVER }}_OnePlus_13T_CustomROM
          path: ${{ steps.package.outputs.zip_name }}
          if-no-files-found: error
